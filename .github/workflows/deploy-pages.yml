name: Deploy to GitHub Pages

# Publishes `main` to Pages — but only after the CI workflow (checks + unit tests
# + naming guard + build + the reliable smoke subset) has SUCCEEDED for that
# commit. `workflow_run` fires when "CI" completes; we then build and deploy only
# when it passed on `main`. This is the gate: a commit that fails any check never
# publishes. `workflow_dispatch` still allows a manual deploy of `main` from the
# Actions tab.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Manual dispatch, or a successful CI run on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      # For a workflow_run trigger, build the exact commit CI validated; for a
      # manual dispatch, build the branch it was launched from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`. CI already validated this
      # commit; this rebuild only produces the artifact to publish.
      - name: Build
        run: npm run build

      # No `actions/configure-pages` step on purpose — vite.config.ts uses a
      # relative base ('./') that works from any subpath, and Pages has to be
      # switched on once by hand (Settings -> Pages -> Source: "GitHub Actions").
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
